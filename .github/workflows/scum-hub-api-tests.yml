name: SCUM HUB migration API tests
on:
  push:
    branches: [scum-hub-migration]
    paths:
      - 'src/migration-worker.mjs'
      - 'src/session-auth.mjs'
      - 'src/steam-openid-config.mjs'
      - 'src/steam-openid.mjs'
      - 'src/steam-verify.mjs'
      - 'src/steam-state.mjs'
      - 'src/issue-session.mjs'
      - 'tests/steam-session.test.mjs'
      - 'src/squad-authorization.mjs'
      - 'tests/squad-authorization.test.mjs'
      - 'tests/squad-access-api.test.mjs'
      - 'tests/squad-data-api.test.mjs'
      - 'sql/steam-member-links-d1.sql'
      - 'tests/steam-openid.test.mjs'
      - 'tests/session-auth.test.mjs'
      - 'tests/migration-worker.test.mjs'
      - '.github/workflows/scum-hub-api-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/migration-worker.test.mjs
