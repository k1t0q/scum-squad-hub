name: SCUM HUB migration API tests
on:
  push:
    branches: [scum-hub-migration]
    paths:
      - 'src/migration-worker.mjs'
      - 'src/explosives-update.mjs'
      - 'src/stash-update.mjs'
      - 'src/map-marker-update.mjs'
      - 'src/map-marker-create.mjs'
      - 'tests/map-marker-create.test.mjs'
      - 'tests/place-posts-api.test.mjs'
      - 'src/map-api-client.mjs'
      - 'tests/map-api-client.test.mjs'
      - 'src/map-marker-delete.mjs'
      - 'tests/map-marker-delete.test.mjs'
      - 'src/legacy-account-link.mjs'
      - 'tests/legacy-account-link.test.mjs'
      - 'src/steam-link-client.mjs'
      - 'tests/steam-link-client.test.mjs'
      - 'src/steam-link-status.mjs'
      - 'tests/steam-link-status.test.mjs'
      - 'tests/map-marker-update.test.mjs'
      - 'tests/map-markers-api.test.mjs'
      - 'tests/stash-update.test.mjs'
      - 'tests/explosives-update.test.mjs'
      - 'src/session-auth.mjs'
      - 'src/steam-openid-config.mjs'
      - 'src/steam-openid.mjs'
      - 'src/steam-verify.mjs'
      - 'src/steam-state.mjs'
      - 'src/issue-session.mjs'
      - 'tests/steam-session.test.mjs'
      - 'src/squad-authorization.mjs'
      - 'tests/squad-authorization.test.mjs'
      - 'tests/squad-access-api.test.mjs'
      - 'tests/squad-data-api.test.mjs'
      - 'sql/steam-member-links-d1.sql'
      - 'tests/steam-openid.test.mjs'
      - 'tests/session-auth.test.mjs'
      - 'tests/migration-worker.test.mjs'
      - 'tests/migration-data-safety.test.mjs'
      - '.github/workflows/scum-hub-api-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - name: Validate Cloudflare Worker bundle without deployment
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/scum-hub-migration-bundle --config wrangler.migration.toml
