name: Deploy isolated SCUM HUB migration Worker
on:
  push:
    branches:
      - scum-hub-migration
  workflow_dispatch:
jobs:
  deploy:
    if: github.ref == 'refs/heads/scum-hub-migration'
    runs-on: ubuntu-latest
    environment: scum-hub-migration
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run migration tests
        run: node --test tests/*.test.mjs
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Cloudflare token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Cloudflare account ID"; exit 1; }
      - name: Prepare original SCUM HUB public assets for isolated preview
        run: |
          mkdir -p migration-public/src
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.svg' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.ico' -o -name '*.webmanifest' -o -name '*.json' \) -exec cp {} migration-public/ \;
          cp src/legacy-d1-adapter.mjs migration-public/src/legacy-d1-adapter.mjs
          test -s migration-public/index.html
          test -s migration-public/app.js
      - name: Deploy migration Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.migration.toml

      - name: Configure Steam session secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCUM_SESSION_HMAC_KEY: ${{ secrets.SCUM_SESSION_HMAC_KEY }}
        run: |
          test -n "$SCUM_SESSION_HMAC_KEY" || { echo "Missing SCUM_SESSION_HMAC_KEY"; exit 1; }
          test "${#SCUM_SESSION_HMAC_KEY}" -ge 32 || { echo "Session key too short"; exit 1; }
          printf '%s' "$SCUM_SESSION_HMAC_KEY" | npx --yes wrangler@4 secret put SESSION_HMAC_KEY --config wrangler.migration.toml
