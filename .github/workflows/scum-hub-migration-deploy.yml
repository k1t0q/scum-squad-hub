name: Deploy isolated SCUM HUB migration Worker
on:
  push:
    branches:
      - scum-hub-migration
  workflow_dispatch:
concurrency:
  group: scum-hub-migration-deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/scum-hub-migration'
    runs-on: ubuntu-latest
    environment: scum-hub-migration
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run migration tests
        run: node --test tests/*.test.mjs
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Cloudflare token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Cloudflare account ID"; exit 1; }
      - name: Prepare original SCUM HUB public assets for isolated preview
        run: |
          mkdir -p migration-public/src
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.svg' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.ico' -o -name '*.webmanifest' \) -exec cp {} migration-public/ \;
          cp src/legacy-d1-adapter.mjs src/d1-client.mjs migration-public/src/
          python3 scripts/build-app-icons.py
          test -s migration-public/apple-touch-icon.png
          test -s migration-public/index.html
          test -s migration-public/app.js
      - name: Deploy migration Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.migration.toml

      - name: Configure ImageKit upload secret for migration Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCUM_IMAGEKIT_PRIVATE_KEY: ${{ secrets.SCUM_IMAGEKIT_PRIVATE_KEY }}
        run: |
          test -n "$SCUM_IMAGEKIT_PRIVATE_KEY" || { echo "Missing ImageKit private key"; exit 1; }
          printf '%s' "$SCUM_IMAGEKIT_PRIVATE_KEY" | npx --yes wrangler@4 secret put IMAGEKIT_PRIVATE_KEY --config wrangler.migration.toml
      - name: Relink verified existing ImageKit photos in migration D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SCUM_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCUM_IMAGEKIT_PRIVATE_KEY: ${{ secrets.SCUM_IMAGEKIT_PRIVATE_KEY }}
        run: node scripts/relink-imagekit.mjs
