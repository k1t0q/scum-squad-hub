name: SCUM HUB D1 migration (manual)
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write to D1 (false = dry run)'
        type: boolean
        required: true
        default: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scum-hub-migration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install migration dependencies
        run: npm install --no-save --no-package-lock --prefix .migration pg@8
      - name: Copy PostgreSQL data to D1
        env:
          SUPABASE_DB_URL: ${{ secrets.SCUM_SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.SCUM_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: e38dfd3ec24a0cfed267d1272a461174
          CF_D1_DATABASE_ID: 924cdc85-bd75-462a-87f6-a9a739054905
          APPLY: ${{ inputs.apply }}
        run: node scripts/migrate-supabase-to-d1.mjs
