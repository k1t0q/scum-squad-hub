<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCUM HUB · Демонстрация</title><link rel="stylesheet" href="/styles.css?v=14.5"><link rel="stylesheet" href="/overrides.css?v=8.28-squad-pointer"><style>
body{margin:0;background:#091112;color:#edf4ef;font-family:Inter,Segoe UI,Arial,sans-serif}.demo-shell{max-width:1200px;margin:auto;padding:18px}.demo-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.demo-brand{color:#fff;font-size:19px;font-weight:900;letter-spacing:2px;text-decoration:none}.demo-brand b{color:#ed484b}.demo-caption{color:#93a8a3;font-size:11px;line-height:1.6}.demo-banner{padding:10px 13px;border:1px solid #304b45;border-radius:7px;color:#a8bcb6;font-size:12px;margin:14px 0;background:#102022}.demo-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.demo-tabs button,.demo-reset{background:#122021;color:#a9beb7;border:1px solid #344c45;border-radius:6px;padding:10px 15px;cursor:pointer;font:inherit;font-size:12px}.demo-tabs button[aria-selected=true]{border-color:#ed484b;color:white;background:#512127}.demo-tabs button:focus-visible,button:focus-visible{outline:2px solid #ed777a;outline-offset:3px}#view{min-height:330px}.demo-map{height:410px;position:relative;overflow:hidden;border:1px solid #3b5148;border-radius:9px;background:#15251b}.map-surface{position:absolute;inset:0;transition:transform .3s}.map-surface img{width:100%;height:100%;object-fit:cover;display:block}.demo-pin{position:absolute;z-index:2;width:32px;height:32px;border-radius:50%;border:2px solid #ffcc76;background:#3a2911;color:#fff;transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 0 0 6px #ffcc7644}.demo-pin.selected{box-shadow:0 0 0 10px #ffcc7677}.demo-map-note{position:absolute;bottom:12px;left:12px;right:12px;z-index:3;padding:12px;border:1px solid #425a4e;border-radius:8px;background:#091514ed;font-size:12px;line-height:1.7}.demo-map-tools{position:absolute;z-index:3;right:12px;top:12px;display:flex;gap:6px}.demo-map-tools button{width:34px;height:34px;background:#0a1815;color:#fff;border:1px solid #4d675a;border-radius:6px;cursor:pointer}.demo-map-layout{display:grid;grid-template-columns:170px 1fr;gap:12px}.demo-map-list{display:grid;gap:8px;align-content:start}.demo-map-list button{text-align:left;background:#142320;color:#e5efea;border:1px solid #354f43;border-radius:7px;padding:13px;cursor:pointer}.demo-map-list small{display:block;color:#eabd6e;margin-top:7px}.demo-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.demo-summary .card{margin:0!important}.demo-summary h2{font-size:13px!important}.demo-summary p{font-size:12px;line-height:1.6;color:#a7bbb1}.demo-stashes{display:grid;gap:12px}.demo-stashes .card{padding:18px}.demo-stashes h3{margin:0 0 10px}.demo-stashes p{font-size:13px;color:#adc0b6}.demo-shell .squad-duty-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.squad-duty-summary>div{padding:9px;background:#0b1916;border:1px solid #2e463b;border-radius:6px;font-size:12px}.demo-shell .toolbar{flex-wrap:wrap}.demo-shell .raid-roster{line-height:1.9}.demo-shell .raid-roster-name.is-in{color:#70dbaa}.demo-shell .raid-roster-name.is-out{color:#7d9689}.demo-dialog{background:#11201b;color:#edf4ef;border:1px solid #4b6858;border-radius:10px;padding:22px;width:calc(100% - 32px);max-width:450px}.demo-dialog::backdrop{background:#000b}.demo-dialog p{line-height:1.8}.demo-dialog button{padding:10px 16px;color:#e0f3e9;background:#243c2d;border:1px solid #4b6858;border-radius:6px;cursor:pointer}.demo-legend{font-size:11px;color:#8fa69a;line-height:1.7}.demo-shell button{font-family:inherit}@media(max-width:650px){.demo-shell{padding:12px}.demo-map-layout{grid-template-columns:1fr}.demo-map-list{display:flex;overflow:auto}.demo-map-list button{min-width:130px}.demo-map{height:330px}.demo-summary{grid-template-columns:1fr}.demo-shell .squad-duty-summary{grid-template-columns:1fr}.demo-tabs button{padding:10px 12px}.demo-brand{font-size:16px}.demo-shell .member-actions-row{flex-wrap:wrap!important}}@media(prefers-reduced-motion:reduce){.map-surface{transition:none}}
</style></head><body><div class="demo-shell"><div class="demo-head"><div><a class="demo-brand" href="/" target="_top">SCUM <b>HUB</b></a><div class="demo-caption">УЧЕБНЫЙ ОТРЯД</div></div><button class="demo-reset" id="reset">Сбросить пример</button></div><div class="demo-banner">Демонстрация без регистрации · Вымышленные участники и данные. Все изменения остаются в этом примере.</div><div class="demo-tabs" role="tablist" aria-label="Разделы штаба"></div><div id="view" role="tabpanel" tabindex="0"></div><p class="demo-legend">Оформление действующего штаба и игровая карта SCUM. Учебные метки, планы и сроки не связаны с реальными отрядами.</p></div><dialog class="demo-dialog" id="details"><h2 id="details-title"></h2><p id="details-text"></p><button id="details-close">Понятно</button></dialog><script>
const $=s=>document.querySelector(s);function esc(s=''){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
const names=['Разведчик','Север','Искра','Тихий'],roles=['Разведчик','Стрелок','Подрывник','Взломщик'];
const makeDb=()=>({profile:{nick:names[0],access:'member'},members:names.map((n,i)=>[n,roles[i],'20:00','Буду','demo-'+i]),ops:[{id:1,title:'Разведка базы в секторе В2',date:'',time:'20:00',note:'Проверить подходы и подготовить точку сбора',participants:names.slice(0,3)},{id:2,title:'Доставка запасов в северный схрон',date:'',time:'21:30',note:'Забрать инструменты и боеприпасы',participants:names.slice(1,3)}]});
let db=makeDb(),squadDutiesLoaded=true,squadDutiesLoading=false,squadDutiesError=false;
const dutyLabels=[['raid','Рейд'],['def','Деф'],['anti','Антирейд']],squadDuties=Object.fromEntries(db.members.map((m,i)=>[m[4],{raid:['Проверить подходы','Прикрывать группу','Подготовить взрывчатку','Открывать замки'][i],def:'Защищать свой сектор',anti:'Держать запасной выход'}]));window.currentSquadName='Учебный отряд';
function participantWord(n){return n===1?'участник':n<5?'участника':'участников'}function formatPlanDate(d){return d}
function showDetails(t,s){$('#details-title').textContent=t;$('#details-text').textContent=s;$('#details').showModal()}$('#details-close').onclick=()=>$('#details').close();
function newOp(){showDetails('Создать план','В штабе здесь задаются цель, дата, время и состав рейда. В примере можно отметить участие в готовом плане.')}
function viewOp(id){const o=db.ops.find(x=>x.id===id);showDetails(o.title,o.note+' · Сбор в '+o.time)}function editOp(id){viewOp(id)}function deleteOp(id){db.ops=db.ops.filter(x=>x.id!==id);ops()}function toggleRaid(id){const o=db.ops.find(x=>x.id===id);o.participants=o.participants.includes(db.profile.nick)?o.participants.filter(n=>n!==db.profile.nick):[...o.participants,db.profile.nick];ops()}
function editMemberDuties(id,nick){const d=squadDuties[id];showDetails('Обязанности: '+nick,'Рейд: '+d.raid+'. Деф: '+d.def+'. Антирейд: '+d.anti+'.')}function loadSquadDuties(){}function changeInviteCode(){}function editMemberNick(){}function kickMemberByNick(){}
let stashes;function resetStashes(){stashes=[['Лесной',6,32,40],['Северный',2,58,28],['Запасной',9,65,65]].map(([name,left,x,y],i)=>({id:i+1,name,x,y,author_nick:names[i],stash_checked_by_nick:names[i],stash_checked_at:new Date(Date.now()-(14-left)*86400000).toISOString()}))}resetStashes();
let selected=0,zoom=1;
function mapPage(){const p=stashes[selected];$('#view').innerHTML='<div class="demo-summary"><div class="card"><h2>План на вечер</h2><p>20:00 · Разведка базы в секторе В2<br>3 участника готовы к выходу</p></div><div class="card"><h2>Discord · Напоминания</h2><p>Северный схрон: осталось 2 дня<br>Протект: до окончания 15 минут</p></div></div><div class="card"><div class="toolbar"><div><h2>Тактическая карта</h2><span class="muted">Выбери метку в списке или на карте</span></div></div><div class="demo-map-layout"><div class="demo-map-list">'+stashes.map((s,i)=>'<button data-pin="'+i+'">📦 '+s.name+'<small>Осталось '+Math.max(0,Math.ceil(14-(Date.now()-Date.parse(s.stash_checked_at))/86400000))+' дн.</small></button>').join('')+'</div><div class="demo-map"><div class="map-surface" style="transform:scale('+zoom+')"><img src="https://k1t0q.github.io/scum-map-k1t0/scum_map_fallback.png" alt="Игровая карта острова SCUM">'+stashes.map((s,i)=>'<button class="demo-pin '+(i===selected?'selected':'')+'" style="left:'+s.x+'%;top:'+s.y+'%" data-pin="'+i+'" aria-label="Схрон '+s.name+'">📦</button>').join('')+'</div><div class="demo-map-tools"><button data-zoom="1" aria-label="Увеличить">+</button><button data-zoom="-1" aria-label="Уменьшить">−</button></div><div class="demo-map-note"><b>'+p.name+'</b> · Проверил: '+p.stash_checked_by_nick+'<br>Учебный схрон. В разделе «Схроны» можно обновить таймер на 14 дней.</div></div></div></div>';$('#view').querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.pin);mapPage()});$('#view').querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{zoom=Math.max(1,Math.min(2.5,zoom+Number(b.dataset.zoom)*.25));mapPage()})}
function stashesPage(){$('#view').innerHTML='<div class="demo-stashes">'+stashes.map(p=>'<article class="card"><h3>📦 '+p.name+'</h3><p>'+p.author_nick+' · Запас снаряжения для выхода. Метка сохранена на карте.</p>'+stashLifeHtml(p)+'<div class="actions"><button onclick="openStash('+p.id+')">Показать на карте</button></div></article>').join('')+'</div>'}
function refreshStash(id){const p=stashes.find(x=>x.id===id);p.stash_checked_at=new Date().toISOString();p.stash_checked_by_nick=db.profile.nick;stashesPage()}function openStash(id){selected=stashes.findIndex(x=>x.id===id);choose(0)}
let active=0;const sections=['Карта','Отряд','Рейды','Схроны'];
function choose(i){active=i;document.querySelectorAll('[role=tab]').forEach((t,n)=>{t.setAttribute('aria-selected',String(n===i));t.tabIndex=n===i?0:-1});$('#view').setAttribute('aria-labelledby','screen-tab-'+i);[mapPage,members,ops,stashesPage][i]()}
$('.demo-tabs').innerHTML=sections.map((n,i)=>'<button role="tab" id="screen-tab-'+i+'" aria-controls="view" aria-selected="'+(i===0)+'" tabindex="'+(i===0?0:-1)+'">'+n+'</button>').join('');
document.querySelectorAll('[role=tab]').forEach((b,i)=>{b.onclick=()=>choose(i);b.onkeydown=e=>{let n;if(e.key==='ArrowRight')n=(i+1)%4;if(e.key==='ArrowLeft')n=(i+3)%4;if(n!==undefined){e.preventDefault();choose(n);document.querySelectorAll('[role=tab]')[n].focus()}}});
$('#reset').onclick=()=>{db=makeDb();resetStashes();selected=0;zoom=1;choose(active)};
function ops(){$('#view').innerHTML='<div class="card"><div class="toolbar"><div><h2>План на рейд</h2><span class="muted">Создать общий план отряда на выбранную дату и время.</span></div><button class="primary" onclick="newOp()">+ СОЗДАТЬ ПЛАН</button></div><div class="list">'+(db.ops.length?db.ops.map(o=>{let p=Array.isArray(o.participants)?o.participants:[];return '<div class="item raiditem raidclick" onclick="viewOp('+o.id+')"><div class="itemtop"><div style="flex:1"><h3>'+esc(o.title)+'</h3><div class="muted">'+(o.date?formatPlanDate(o.date)+' · ':'')+esc(o.time)+(o.note?' · '+esc(o.note):'')+'</div></div><span class="badge">'+p.length+' '+participantWord(p.length)+'</span></div><div class="raid-list-roster"><small class="muted">Участники:</small><div class="raid-roster">'+db.members.map(m=>'<span class="raid-roster-name '+(p.includes(m[0])?'is-in':'is-out')+'">'+esc(m[0])+'</span>').join('<span class="raid-comma">, </span>')+'</div></div><div class="actions"><button class="raid-participation '+(p.includes(db.profile.nick)?'leave':'join')+'" onclick="event.stopPropagation();toggleRaid('+o.id+')">'+(p.includes(db.profile.nick)?'Не участвую':'Участвую')+'</button><button onclick="event.stopPropagation();editOp('+o.id+')">Редактировать</button><button onclick="event.stopPropagation();deleteOp('+o.id+')">Удалить</button></div></div>'}).join(''):'<div class="empty">Планов пока нет</div>')+'</div></div>'}

let photoScrollY=0,photoEditor=null;
function members(){if(!squadDutiesLoaded&&!squadDutiesLoading&&!squadDutiesError)void loadSquadDuties();let admin=db.profile.access==='admin'||db.profile.nick==='k1t0';$('#view').innerHTML='<div class="card"><div class="toolbar"><div><h2>Состав '+esc(window.currentSquadName||'FURY')+'</h2><span class="muted">Распределение обязанностей на рейде, дефе и антирейде.</span></div>'+(admin?'<button class="ghost" onclick="changeInviteCode()">СМЕНИТЬ КОД ВСТУПЛЕНИЯ</button>':'')+'</div><div class="list">'+db.members.map(m=>'<div class="item"><div class="itemtop"><div><h3>'+esc(m[0])+(m[0]===db.profile.nick&&admin?' <span class="badge work">АДМИН</span>':'')+'</h3><span class="muted">'+esc(m[1])+'</span></div><div class="member-actions-row" style="display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;align-items:center!important;justify-content:flex-end!important;gap:8px!important">'+'<button onclick="editMemberDuties(\''+esc(m[4])+'\',\''+esc(m[0]).replace(/'/g,"\\'")+'\')">Задачи</button>'+(admin&&m[0]!==db.profile.nick?'<button onclick="editMemberNick(\''+esc(m[0]).replace(/'/g,"\\'")+'\')">Изменить ник</button><button class="danger" onclick="kickMemberByNick(\''+esc(m[0]).replace(/'/g,"\\'")+'\')">Выгнать</button>':'')+'</div></div>'+dutySummary(m)+'</div>').join('')+'</div></div>'}
function dutySummary(m){
 const d=squadDuties[m[4]]||{};
 if(squadDutiesError&&!squadDutiesLoaded)return '<div class="squad-duty-summary"><button onclick="loadSquadDuties()">Повторить загрузку обязанностей</button></div>';
 if(!squadDutiesLoaded)return '<div class="squad-duty-summary"><span class="muted">Загрузка обязанностей…</span></div>';
 return '<div class="squad-duty-summary">'+dutyLabels.map(([key,label])=>'<div><b>'+label+':</b> <span>'+esc(d[key]||'Не назначено')+'</span></div>').join('')+'</div>';
}
function stashLifeHtml(p){
 const checked=p.stash_checked_at||p.created_at;
 const elapsed=Date.now()-new Date(checked).getTime();
 const left=Math.max(0,Math.ceil((14*86400000-elapsed)/86400000));
 const expired=elapsed>=14*86400000;
 const time=new Date(checked).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'});
 const nick=esc(p.stash_checked_by_nick||p.author_nick||'Участник');
 return '<div style="margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:9px"><span style="font-size:12px;color:'+(expired?'#ef6464':left<=2?'#e8ad55':'#9ca8a2')+'">'+(expired?'Срок хранения истёк': 'До истечения: '+left+' дн.')+'</span><span class="muted" style="font-size:12px">Проверил: '+nick+' · '+time+' МСК</span><button class="ghost" style="font-size:12px;padding:7px 10px" onclick="refreshStash('+p.id+',this)">Обновить схрон</button></div>';
}
const initial=new URLSearchParams(location.search).get('section');choose(Math.max(0,['map','members','raids','stashes'].indexOf(initial)));
</script></body></html>
