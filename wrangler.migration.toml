name = "scum-hub-migration"
main = "src/migration-worker.mjs"
compatibility_date = "2026-10-27"
workers_dev = true

[vars]
PUBLIC_ORIGIN = "https://scum-hub-migration.nikitinrf.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "scum-hub-db"
database_id = "924cdc85-bd75-462a-87f6-a9a739054905"

# Configure SESSION_HMAC_KEY and legacy auth
# through Cloudflare Worker secrets before enabling Steam login.
# Never put secret values in this file.

# Serve the original SCUM HUB frontend on the migration Worker origin.
# CI builds this directory from the existing public site files.
[assets]
directory = "./migration-public"
binding = "ASSETS"
run_worker_first = true
