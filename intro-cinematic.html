<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCUM HUB — Три сцены</title><style>
*{box-sizing:border-box}body{margin:0;background:#090c0b;color:#edece5;font:16px Arial,sans-serif}header,main{max-width:1440px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;border-bottom:1px solid #29312b;gap:20px}a{color:#a9b1a8}.brand{font-weight:900;letter-spacing:3px}.brand b{color:#e8463e}h1{font-size:clamp(26px,4vw,46px);margin:22px 0 12px}p{color:#a4aea4;line-height:1.6}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 18px}button{background:#16201a;border:1px solid #39463d;color:#ebece4;padding:13px 18px;font:inherit;cursor:pointer;border-radius:4px}button[aria-pressed=true]{background:#a5352d;border-color:#e65b4e}button:focus-visible{outline:3px solid #ffb67e;outline-offset:3px}.stage{position:relative;aspect-ratio:16/9;min-height:270px;overflow:hidden;background:#050706;border:1px solid #2c3830}.scene{position:absolute;inset:0;overflow:hidden}.scene[hidden]{display:none}.art{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.9}.art{filter:brightness(.55)}.mech .logo{left:61%;top:45%;font-size:clamp(70px,12vw,150px)}.shade{position:absolute;inset:0;background:linear-gradient(0deg,#020504d9,transparent 65%)}.mist{position:absolute;inset:-20%;background:radial-gradient(ellipse at 25% 60%,#b7cebb66,transparent 40%),radial-gradient(ellipse at 70% 75%,#dae0cd44,transparent 35%);opacity:0}.logo{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-weight:1000;font-size:clamp(78px,19vw,250px);letter-spacing:-.09em;color:#e3e1cf;text-shadow:3px 0 #823e34;opacity:1;line-height:1}.logo span{color:#d54c3b}.subtitle{position:absolute;left:0;right:0;top:72%;text-align:center;font:12px monospace;letter-spacing:6px;color:#c2c7b7}.beam{position:absolute;inset:-80%;background:conic-gradient(from 80deg at 20% 50%,transparent 0deg,#ff322e66 9deg,transparent 19deg);opacity:0;mix-blend-mode:screen}.seam{position:absolute;left:49.8%;top:8%;bottom:7%;width:2px;background:#ffad78;box-shadow:0 0 40px 15px #d8382366;opacity:0}.glitch{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 6px,#ccdfcc30 6px 7px);opacity:0}.status{position:absolute;left:22px;bottom:20px;color:#b8c2b3;font:11px monospace;letter-spacing:2px}.tools{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:18px;flex-wrap:wrap}.tools p{margin:0;font-size:14px;max-width:820px}.playing .art{animation:camera 5.6s ease-out both}.playing .logo{animation:reveal 5.6s both}.playing .subtitle{animation:caption 5.6s both}.playing .mist{animation:fog 5.6s both}.playing.bunker .seam{animation:seam 5.6s both}.playing.prisoner .glitch{animation:interference 5.6s both}.playing.prisoner .logo{animation:signal 5.6s both}.playing.mech .beam{animation:sweep 5.6s both}.playing.mech .logo{animation:detected 5.6s both}@keyframes camera{0%{transform:scale(1.09);filter:brightness(.4)}40%{filter:brightness(1)}100%{transform:scale(1);filter:brightness(.55)}}@keyframes reveal{0%,38%{opacity:0;filter:blur(8px);transform:translate(-50%,-45%) scale(.92)}65%,100%{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}}@keyframes caption{0%,65%{opacity:0}100%{opacity:1}}@keyframes fog{0%{opacity:0;transform:translateX(-7%)}40%{opacity:.8}100%{opacity:0;transform:translateX(9%)}}@keyframes seam{0%,12%{opacity:0}24%,42%{opacity:1;transform:scaleX(1)}60%,100%{opacity:0;transform:scaleX(90)}}@keyframes interference{0%,28%,35%,40%,49%,100%{opacity:0}30%,37%,46%{opacity:.8}}@keyframes signal{0%,38%{opacity:0}40%{opacity:1;transform:translate(-48%,-50%)}43%{opacity:0}46%{opacity:1;transform:translate(-52%,-50%)}49%{opacity:.1}57%,100%{opacity:1;transform:translate(-50%,-50%)}}@keyframes sweep{0%{opacity:0;transform:rotate(-35deg)}15%,48%{opacity:1}65%,100%{opacity:0;transform:rotate(40deg)}}@keyframes detected{0%,43%{opacity:0;clip-path:inset(0 100% 0 0)}66%,100%{opacity:1;clip-path:inset(0)}}@media(max-width:600px){header,main{padding:16px}.stage{aspect-ratio:4/3}.tabs button{flex:1;padding:12px 8px;font-size:13px}.subtitle{letter-spacing:3px;font-size:10px}.status{font-size:9px;left:12px;bottom:12px}.logo{font-size:30vw}.art{object-position:center}}
@media(prefers-reduced-motion:reduce){.playing *{animation:none!important}.art{filter:brightness(.55)}.mist,.beam,.seam,.glitch{display:none}}
</style></head><body><header><div class="brand">SCUM <b>HUB</b></div><a href="/">На главную</a></header><main><h1>Три истории. Один штаб.</h1><p>Выбери сцену и посмотри, как появляется SH. После заставки знак остаётся неподвижным.</p><div class="tabs" aria-label="Вариант заставки"><button data-scene="bunker" aria-pressed="true">01 · Бункер TEC1</button><button data-scene="prisoner" aria-pressed="false">02 · Заключённый</button><button data-scene="mech" aria-pressed="false">03 · Мех</button></div><div class="stage" aria-label="Предпросмотр вступительной анимации"><section class="scene bunker" id="bunker" aria-label="Бункер TEC1"><img class="art" src="intro-cinematic-bunker.svg" alt="Стальная дверь бункера в туманном лесу"><div class="seam"></div><div class="mist"></div><div class="shade"></div><div class="logo">S<span>H</span></div><div class="subtitle">SCUM HUB</div><div class="status">TEC1 // ACCESS GRANTED</div></section><section class="scene prisoner" id="prisoner" hidden aria-label="Заключённый"><img class="art" src="intro-cinematic-prisoner.svg" alt="Заключённый в оранжевой робе в мрачном лесу"><div class="mist"></div><div class="shade"></div><div class="glitch"></div><div class="logo">S<span>H</span></div><div class="subtitle">SCUM HUB</div><div class="status">SUBJECT DETECTED // SIGNAL ACQUIRED</div></section><section class="scene mech" id="mech" hidden aria-label="Мех"><img class="art" src="intro-cinematic-mech.svg" alt="Военный охранный мех у заброшенного объекта"><div class="shade"></div><div class="beam"></div><div class="mist"></div><div class="logo">S<span>H</span></div><div class="subtitle">SCUM HUB</div><div class="status">SENTRY // TARGET IDENTIFIED</div></section></div><div class="tools"><p id="description" aria-live="polite"></p><button id="replay">↻ Повторить сцену</button></div></main><script>
const descriptions={bunker:'Дверь оживает красным светом. Из шва выходит дым, и сквозь него проявляется трафарет SH.',prisoner:'Заключённый исчезает в тумане. Сигнал импланта прерывает сцену помехами — появляется SH.',mech:'Красный поисковый луч проходит по объекту, обнаруживает SH и гаснет.'};let current='bunker';const scenes=[...document.querySelectorAll('.scene')];let timer;function seen(id){try{return sessionStorage.getItem('sh-cinematic-v1-'+id)==='1'}catch{return false}}function play(force=false){clearTimeout(timer);const node=document.getElementById(current);node.classList.remove('playing');if(force||!seen(current)){void node.offsetWidth;node.classList.add('playing');try{sessionStorage.setItem('sh-cinematic-v1-'+current,'1')}catch{}timer=setTimeout(()=>node.classList.remove('playing'),5700)}}async function select(id){current=id;scenes.forEach(node=>{node.classList.remove('playing');node.hidden=node.id!==id});document.querySelectorAll('[data-scene]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.scene===id)));document.getElementById('description').textContent=descriptions[id];const img=document.querySelector('#'+id+' img');try{await img.decode()}catch{}if(current===id)play()}document.querySelectorAll('[data-scene]').forEach(button=>button.onclick=()=>select(button.dataset.scene));document.getElementById('replay').onclick=()=>play(true);select(current);
</script></body></html>
